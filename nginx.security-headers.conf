# Security headers for the SPA. Included in every location that serves the app:
# a location with its own add_header drops all add_header lines of the server.
# frame-ancestors is 'self' (not 'none') because the app embeds
# /api/config/disclaimer in an iframe.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
