name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt pytest
      - run: python -m pytest app/tests -v
      # The frontend client is generated from frontend/openapi.json; it must match the code
      - run: python scripts/dump_openapi_spec.py
      - name: OpenAPI spec is up to date
        run: |
          git diff --exit-code frontend/openapi.json || {
            echo "::error::frontend/openapi.json is outdated. Run: python scripts/dump_openapi_spec.py"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json  # pnpm version from "packageManager"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: |
          pnpm generate-api
          git diff --exit-code src/api/generated || {
            echo "::error::src/api/generated is outdated. Run: pnpm generate-api"
            exit 1
          }
      - run: pnpm type-check
      - run: pnpm exec eslint src --quiet
      - run: pnpm build

  # Known vulnerabilities in dependencies. Separate jobs, so a new advisory
  # shows up as its own failure next to passing tests.
  audit-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r app/requirements.txt --progress-spinner off

  audit-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      # Production dependencies only; build tooling does not ship to browsers.
      - run: pnpm audit --prod --audit-level high
