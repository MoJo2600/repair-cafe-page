# NPM sets X-Forwarded-Proto to the scheme the browser used (https). Without
# NPM in front (local docker compose), use this server's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    # Real client IP. Only NPM reaches this container (no host port, Docker
    # network npm-repaircafe), and NPM sets X-Real-IP to the real client: the
    # LAN address, or CF-Connecting-IP for requests through the Cloudflare tunnel.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Allow larger uploads (20 MB repair attachments, logo images, PDF templates)
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ── API → backend container ───────────────────────────────────────────────
    # All /api/* routes (REST endpoints + auth) are handled by Flask/Gunicorn.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        # Flask's ProxyFix trusts exactly one proxy (this one), so every
        # X-Forwarded-* header is set here and never passed on from the client.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        # Generous timeout for slow operations (PDF signing, CSV export)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # ── Vite content-hashed assets — immutable cache ──────────────────────────
    # Vite names every asset file with a content hash, so these never change.
    location /assets/ {
        root /usr/share/nginx/html;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # ── SPA — serve Vite's index.html for everything else ────────────────────
    # try_files serves exact files first (favicon.ico, icon-512.png, etc. from
    # frontend/public/), then falls back to a named location that serves
    # index.html so Vue Router can handle the route client-side.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @spa;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location @spa {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =503;
    }
}
